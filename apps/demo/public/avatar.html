<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/gh/dylanNew/live2d/webgl/Live2D/lib/live2d.min.js"></script>
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/index.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const modelUrl = params.get("model") || "https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display@0.4.0/test/assets/haru/haru_greeter_t03.model3.json";
    const isCubism2 = modelUrl.includes(".model.json") && !modelUrl.includes(".model3.json");

    const app = new PIXI.Application({ backgroundAlpha: 0, autoStart: true, resizeTo: window });
    document.body.appendChild(app.view);

    // Audio context for lip sync analysis
    let audioContext = null;
    let analyser = null;

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.6;
      }
      return { audioContext, analyser };
    }

    // Set mouth parameter on model
    function setMouth(model, value) {
      if (!model || !model.internalModel) return;
      try {
        if (isCubism2) {
          model.internalModel.coreModel.setParamFloat("PARAM_MOUTH_OPEN_Y", value);
        } else {
          model.internalModel.coreModel.setParameterValueById("ParamMouthOpenY", value);
        }
      } catch (e) {
        try { model.internalModel.coreModel.setParameterValueById("ParamMouthOpenY", value); } catch { }
        try { model.internalModel.coreModel.setParamFloat("PARAM_MOUTH_OPEN_Y", value); } catch { }
      }
    }

    // Audio-driven lip sync — reads amplitude from audio in real-time
    function startAudioLipSync(model, audioElement) {
      const { audioContext: ctx, analyser: anal } = getAudioContext();
      const source = ctx.createMediaElementSource(audioElement);
      source.connect(anal);
      anal.connect(ctx.destination);

      const dataArray = new Uint8Array(anal.frequencyBinCount);
      let animFrame;

      function animate() {
        anal.getByteFrequencyData(dataArray);
        // Focus on speech frequencies (300Hz - 3000Hz)
        let sum = 0;
        const start = Math.floor(300 / (ctx.sampleRate / anal.fftSize));
        const end = Math.floor(3000 / (ctx.sampleRate / anal.fftSize));
        for (let i = start; i < end && i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        const avg = sum / (end - start) / 255;
        // Map to mouth value with smoothing
        const mouthValue = Math.min(1, avg * 2.5);
        setMouth(model, mouthValue);
        animFrame = requestAnimationFrame(animate);
      }
      animate();

      return () => {
        cancelAnimationFrame(animFrame);
        setMouth(model, 0);
        try { source.disconnect(); } catch { }
      };
    }

    // Fallback: simulated mouth for browser TTS
    function animateMouthSimulated(model, durationMs) {
      const start = Date.now();
      let frame;
      function animate() {
        const elapsed = Date.now() - start;
        if (elapsed < durationMs) {
          const fast = Math.sin(elapsed / 80) * 0.5 + 0.5;
          const slow = Math.sin(elapsed / 200) * 0.3 + 0.3;
          setMouth(model, Math.min(1, fast * 0.7 + slow * 0.3));
          frame = requestAnimationFrame(animate);
        } else {
          setMouth(model, 0);
        }
      }
      animate();
      return () => { cancelAnimationFrame(frame); setMouth(model, 0); };
    }

    // Idle animation — breathing + eye blink
    function startIdleAnimation(model) {
      let frame;
      function animate() {
        const t = Date.now();
        // Breathing
        try {
          const breathVal = Math.sin(t / 3000) * 0.5 + 0.5;
          if (isCubism2) {
            model.internalModel.coreModel.setParamFloat("PARAM_BREATH", breathVal);
          } else {
            model.internalModel.coreModel.setParameterValueById("ParamBreath", breathVal);
          }
        } catch { }
        frame = requestAnimationFrame(animate);
      }
      animate();
      return () => cancelAnimationFrame(frame);
    }

    // Set expression + motion based on emotion
    function applyEmotion(model, emotion) {
      const expressionMap = {
        happy: ["happy", "smile", "f01"],
        sad: ["sad", "cry", "f04"],
        angry: ["angry", "f03"],
        surprised: ["surprised", "shock", "f02"],
        thinking: ["thinking", "doubt"],
        neutral: ["neutral", "idle", "f00"],
      };
      const motionMap = {
        happy: ["tap_body", "flick_head", "shake"],
        sad: ["idle"],
        angry: ["shake", "tap_body"],
        surprised: ["flick_head", "pinch_in", "tap_body"],
        thinking: ["idle"],
        neutral: ["idle"],
      };

      const expressions = expressionMap[emotion] || ["neutral"];
      for (const expr of expressions) {
        try { model.expression(expr); break; } catch { }
      }
      const motions = motionMap[emotion] || ["idle"];
      for (const m of motions) {
        try { model.motion(m, undefined, 3); break; } catch { }
      }
    }

    // Voice selection for browser TTS fallback
    function getBestVoice(text) {
      const voices = speechSynthesis.getVoices();
      const hasChinese = /[\u4e00-\u9fff]/.test(text);
      const hasJapanese = /[\u3040-\u309f\u30a0-\u30ff]/.test(text);
      if (hasChinese) return voices.find(v => v.lang.startsWith("zh")) || null;
      if (hasJapanese) return voices.find(v => v.lang.startsWith("ja")) || null;
      return voices.find(v => v.name.includes("Samantha"))
        || voices.find(v => v.lang.startsWith("en")) || null;
    }

    async function loadModel() {
      try {
        const model = await PIXI.live2d.Live2DModel.from(modelUrl, { autoInteract: true });
        window._live2dModel = model;

        const scale = Math.min(window.innerWidth / model.width, window.innerHeight / model.height) * 0.8;
        model.scale.set(scale);
        model.anchor.set(0.5, 0.5);
        model.x = window.innerWidth / 2;
        model.y = window.innerHeight / 2;
        app.stage.addChild(model);

        // Start idle animation
        startIdleAnimation(model);

        // Mouse tracking — eyes follow cursor
        document.addEventListener("pointermove", (e) => {
          model.focus(e.clientX, e.clientY);
        });

        // Preload voices for fallback
        speechSynthesis.getVoices();

        window.parent.postMessage({ type: "live2d-ready" }, "*");

        // Track audio sources to avoid re-creating MediaElementSource
        const audioSourceMap = new WeakMap();

        window.addEventListener("message", async (e) => {
          if (e.data.type === "speak") {
            const { text, emotion, audioUrl, useBrowserTTS } = e.data;

            applyEmotion(model, emotion || "neutral");

            if (audioUrl && !useBrowserTTS) {
              // Server TTS audio — real lip sync
              const audio = new Audio(audioUrl);
              audio.crossOrigin = "anonymous";
              window._currentAudio = audio; // Track for interrupt
              let stopLipSync;

              audio.onplay = () => {
                try {
                  stopLipSync = startAudioLipSync(model, audio);
                  window._stopLipSync = stopLipSync; // Track for interrupt
                } catch (err) {
                  // If MediaElementSource fails, use simulated
                  console.warn("Audio lip sync failed, using simulated:", err);
                  stopLipSync = animateMouthSimulated(model, text.length * 80);
                  window._stopLipSync = stopLipSync;
                }
              };

              audio.onended = () => {
                if (stopLipSync) stopLipSync();
                window._currentAudio = null;
                window._stopLipSync = null;
                setMouth(model, 0);
                window.parent.postMessage({ type: "speak-done" }, "*");
                setTimeout(() => applyEmotion(model, "neutral"), 2000);
              };

              audio.onerror = () => {
                if (stopLipSync) stopLipSync();
                window._currentAudio = null;
                window._stopLipSync = null;
                window.parent.postMessage({ type: "speak-done" }, "*");
              };

              try { await audio.play(); } catch (err) {
                console.warn("Audio play failed:", err);
                window._currentAudio = null;
                window.parent.postMessage({ type: "speak-done" }, "*");
              }

            } else {
              // Browser TTS fallback
              if (speechSynthesis) {
                const utterance = new SpeechSynthesisUtterance(text);
                const voice = getBestVoice(text);
                if (voice) utterance.voice = voice;

                let stopMouth;
                utterance.onstart = () => {
                  stopMouth = animateMouthSimulated(model, Math.max(text.length * 80, 1500));
                };
                utterance.onend = () => {
                  if (stopMouth) stopMouth();
                  setMouth(model, 0);
                  window.parent.postMessage({ type: "speak-done" }, "*");
                  setTimeout(() => applyEmotion(model, "neutral"), 2000);
                };
                utterance.onerror = () => {
                  if (stopMouth) stopMouth();
                  window.parent.postMessage({ type: "speak-done" }, "*");
                };
                speechSynthesis.speak(utterance);
              } else {
                window.parent.postMessage({ type: "speak-done" }, "*");
              }
            }
          }

          if (e.data.type === "stop-speaking") {
            // Stop browser TTS
            speechSynthesis.cancel();
            // Stop audio element (TTS from ElevenLabs/Google Cloud)
            if (window._currentAudio) {
              window._currentAudio.pause();
              window._currentAudio.currentTime = 0;
              window._currentAudio.src = "";
              window._currentAudio = null;
            }
            // Stop lip sync animation
            if (window._stopLipSync) {
              window._stopLipSync();
              window._stopLipSync = null;
            }
            setMouth(model, 0);
            window.parent.postMessage({ type: "speak-done" }, "*");
          }
        });

      } catch (err) {
        console.error("Failed to load Live2D model:", err);
        window.parent.postMessage({ type: "live2d-error", error: err.message }, "*");
      }
    }

    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    loadModel();

    window.addEventListener("resize", () => {
      const model = window._live2dModel;
      if (model) {
        const scale = Math.min(window.innerWidth / model.width, window.innerHeight / model.height) * 0.8;
        model.scale.set(scale);
        model.anchor.set(0.5, 0.5);
        model.x = window.innerWidth / 2;
        model.y = window.innerHeight / 2;
      }
    });
  </script>
</body>

</html>
