<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <!-- Live2D scripts — self-hosted to avoid CDN blocks (cubism.live2d.com blocked in China) -->
  <script>
    var _scriptsLoaded = 0;
    var _scriptsFailed = false;
    function _onScriptLoad() {
      _scriptsLoaded++;
      // All 4 scripts loaded — proceed
    }
    function _onScriptError(name) {
      if (!_scriptsFailed) {
        _scriptsFailed = true;
        console.error("[Avatar] Script load failed:", name);
        window.parent.postMessage({ type: "live2d-error", error: "Script load failed: " + name }, "*");
      }
    }
  </script>
  <script src="/lib/live2d.min.js" onload="_onScriptLoad()" onerror="_onScriptError('live2d')"></script>
  <script src="/lib/live2dcubismcore.min.js" onload="_onScriptLoad()" onerror="_onScriptError('cubismcore')"></script>
  <script src="/lib/pixi.min.js" onload="_onScriptLoad()" onerror="_onScriptError('pixi')"></script>
  <script src="/lib/pixi-live2d-display.min.js" onload="_onScriptLoad()"
    onerror="_onScriptError('live2d-display')"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const modelUrl = params.get("model") || "https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display@0.4.0/test/assets/haru/haru_greeter_t03.model3.json";
    const isCubism2 = modelUrl.includes(".model.json") && !modelUrl.includes(".model3.json");

    const app = new PIXI.Application({ backgroundAlpha: 0, autoStart: true, resizeTo: window });
    document.body.appendChild(app.view);

    // Audio context for lip sync analysis
    let audioContext = null;
    let analyser = null;

    // ═══ Expression Override System ═══
    // Stores expression parameter overrides that persist across idle animation frames.
    // Without this, idle animation (ParamEyeLOpen, ParamAngleX, etc.) would overwrite
    // expression values every single frame, making expressions invisible.
    window._expressionOverrides = {}; // { paramId: value }
    window._expressionActive = false;

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.6;
      }
      return { audioContext, analyser };
    }

    // Set mouth parameter on model
    function setMouth(model, value) {
      if (!model || !model.internalModel) return;
      try {
        if (isCubism2) {
          model.internalModel.coreModel.setParamFloat("PARAM_MOUTH_OPEN_Y", value);
        } else {
          model.internalModel.coreModel.setParameterValueById("ParamMouthOpenY", value);
        }
      } catch (e) {
        try { model.internalModel.coreModel.setParameterValueById("ParamMouthOpenY", value); } catch { }
        try { model.internalModel.coreModel.setParamFloat("PARAM_MOUTH_OPEN_Y", value); } catch { }
      }
    }

    // Phoneme-level lip sync — maps FFT frequency bands to vowel mouth shapes (a/i/u/e/o)
    // Inspired by CRI LipSync technology used in Live2D Cubism 5.0
    function startAudioLipSync(model, audioElement) {
      const { audioContext: ctx, analyser: anal } = getAudioContext();
      const source = ctx.createMediaElementSource(audioElement);
      source.connect(anal);
      anal.connect(ctx.destination);

      const dataArray = new Uint8Array(anal.frequencyBinCount);
      let animFrame;
      let smoothOpen = 0, smoothForm = 0;
      let prevOpen = 0;

      // Vowel frequency formant ranges (F1 = openness, F2 = frontness)
      // a: F1=800-1200Hz (open), F2=1000-1400Hz (central)
      // i: F1=250-400Hz (closed), F2=2000-3000Hz (front)
      // u: F1=250-400Hz (closed), F2=600-1000Hz (back)
      // e: F1=400-600Hz (mid), F2=1800-2500Hz (front)
      // o: F1=400-600Hz (mid), F2=600-1000Hz (back)

      function getFreqBand(startHz, endHz) {
        const binSize = ctx.sampleRate / anal.fftSize;
        const s = Math.floor(startHz / binSize);
        const e = Math.min(Math.floor(endHz / binSize), dataArray.length - 1);
        let sum = 0, count = 0;
        for (let i = s; i <= e; i++) { sum += dataArray[i]; count++; }
        return count > 0 ? sum / count / 255 : 0;
      }

      function animate() {
        anal.getByteFrequencyData(dataArray);

        // Extract formant energy bands
        const lowF1 = getFreqBand(250, 500);    // Closed vowels (i, u)
        const midF1 = getFreqBand(500, 800);    // Mid vowels (e, o)
        const highF1 = getFreqBand(800, 1200);  // Open vowels (a)
        const backF2 = getFreqBand(600, 1200);  // Back vowels (u, o)
        const frontF2 = getFreqBand(1800, 3000); // Front vowels (i, e)
        const totalEnergy = getFreqBand(100, 4000);

        // Determine mouth openness (ParamMouthOpenY): 0=closed, 1=wide open
        let mouthOpen = 0;
        if (totalEnergy > 0.05) {
          // a = most open, e/o = medium, i/u = least open
          mouthOpen = Math.min(1, highF1 * 2.5 + midF1 * 1.5 + lowF1 * 0.8);
        }

        // Determine mouth shape (ParamMouthForm): -1=round(o/u), 0=neutral, 1=wide(i/e)
        let mouthForm = 0;
        if (totalEnergy > 0.05) {
          const frontness = frontF2 - backF2;
          mouthForm = Math.max(-1, Math.min(1, frontness * 3));
        }

        // Smooth with different speeds for natural movement
        const openSpeed = mouthOpen > smoothOpen ? 0.45 : 0.15;
        smoothOpen += (mouthOpen - smoothOpen) * openSpeed;
        smoothForm += (mouthForm - smoothForm) * 0.2;

        // Add micro-variation
        const microVar = (Math.random() - 0.5) * 0.02;
        const finalOpen = Math.max(0, Math.min(1, smoothOpen + microVar));
        const finalForm = Math.max(-1, Math.min(1, smoothForm));

        // Apply to model parameters
        setMouth(model, finalOpen);
        // Set mouth form (wide vs round) if the model supports it
        setParam(model, 'ParamMouthForm', finalForm);

        prevOpen = finalOpen;
        animFrame = requestAnimationFrame(animate);
      }
      animate();

      return () => {
        cancelAnimationFrame(animFrame);
        let closeFrame;
        let closeVal = prevOpen;
        function smoothClose() {
          closeVal *= 0.7;
          if (closeVal > 0.01) {
            setMouth(model, closeVal);
            setParam(model, 'ParamMouthForm', 0);
            closeFrame = requestAnimationFrame(smoothClose);
          } else {
            setMouth(model, 0);
            setParam(model, 'ParamMouthForm', 0);
          }
        }
        smoothClose();
      };
    }

    // Fallback: simulated mouth with natural speech rhythm
    function animateMouthSimulated(model, durationMs) {
      const start = Date.now();
      let frame;
      let smoothedValue = 0;

      // Generate random "syllable" timestamps for natural rhythm
      const syllableDuration = 120 + Math.random() * 60; // 120-180ms per syllable
      const pauseChance = 0.12; // 12% chance of brief pause (breathing, thinking)

      function animate() {
        const elapsed = Date.now() - start;
        if (elapsed < durationMs) {
          // Syllable rhythm
          const syllablePos = (elapsed % syllableDuration) / syllableDuration;
          const syllableShape = Math.sin(syllablePos * Math.PI); // Open→close per syllable

          // Vary intensity over time (sentence rhythm: start soft, peak, trail off)
          const sentencePos = elapsed / durationMs;
          const sentenceEnvelope = Math.sin(sentencePos * Math.PI) * 0.4 + 0.6; // 0.6→1.0→0.6

          // Random pauses
          const isPause = Math.sin(elapsed / 400) > (1 - pauseChance * 2) && syllablePos < 0.2;

          const targetValue = isPause ? 0.05 : syllableShape * sentenceEnvelope * (0.5 + Math.random() * 0.3);

          // Smooth
          const speed = targetValue > smoothedValue ? 0.35 : 0.15;
          smoothedValue += (targetValue - smoothedValue) * speed;

          setMouth(model, Math.max(0, Math.min(1, smoothedValue)));
          frame = requestAnimationFrame(animate);
        } else {
          // Smooth close
          let closeVal = smoothedValue;
          function smoothClose() {
            closeVal *= 0.75;
            if (closeVal > 0.01) {
              setMouth(model, closeVal);
              frame = requestAnimationFrame(smoothClose);
            } else {
              setMouth(model, 0);
            }
          }
          smoothClose();
        }
      }
      animate();
      return () => { cancelAnimationFrame(frame); setMouth(model, 0); };
    }

    // Idle animation — breathing + eye blink
    // ⚠️ IMPORTANT: This runs every frame. Expression overrides (window._expressionOverrides)
    // are re-applied each frame AFTER idle updates, so expressions persist visually.
    function startIdleAnimation(model) {
      let frame;
      let nextBlink = Date.now() + 2000 + Math.random() * 4000;
      let blinkPhase = 0; // 0=open, 1=closing, 2=closed, 3=opening
      let blinkTimer = 0;

      // Params that idle animation controls — expression overrides take priority
      const IDLE_PARAMS = new Set([
        'ParamBreath', 'ParamAngleX', 'ParamAngleY', 'ParamBodyAngleX',
        'ParamEyeLOpen', 'ParamEyeROpen'
      ]);

      function animate() {
        const t = Date.now();
        const overrides = window._expressionOverrides || {};
        const hasOverrides = window._expressionActive && Object.keys(overrides).length > 0;

        try {
          // Breathing — smooth sine wave (only if not overridden)
          if (!overrides.hasOwnProperty('ParamBreath')) {
            const breathVal = Math.sin(t / 3000) * 0.5 + 0.5;
            setParam(model, 'ParamBreath', breathVal);
          }

          // Subtle head sway (only if not overridden)
          const headX = Math.sin(t / 5000) * 3 + Math.sin(t / 7000) * 2;
          const headY = Math.sin(t / 6000) * 2 + Math.sin(t / 9000) * 1.5;
          if (!overrides.hasOwnProperty('ParamAngleX')) setParam(model, 'ParamAngleX', headX);
          if (!overrides.hasOwnProperty('ParamAngleY')) setParam(model, 'ParamAngleY', headY);
          if (!overrides.hasOwnProperty('ParamBodyAngleX')) setParam(model, 'ParamBodyAngleX', headX * 0.3);

          // Eye blinking — only if eye params are not overridden by expression
          const eyeOverridden = overrides.hasOwnProperty('ParamEyeLOpen') ||
            overrides.hasOwnProperty('ParamEyeROpen') ||
            overrides.hasOwnProperty('ParamEyeLSmile') ||
            overrides.hasOwnProperty('ParamEyeRSmile');

          if (!eyeOverridden) {
            if (t > nextBlink && blinkPhase === 0) {
              blinkPhase = 1;
              blinkTimer = t;
            }
            if (blinkPhase > 0) {
              const elapsed = t - blinkTimer;
              if (blinkPhase === 1 && elapsed < 80) {
                const p = elapsed / 80;
                setParam(model, 'ParamEyeLOpen', 1 - p);
                setParam(model, 'ParamEyeROpen', 1 - p);
              } else if (blinkPhase === 1) {
                blinkPhase = 2;
                blinkTimer = t;
                setParam(model, 'ParamEyeLOpen', 0);
                setParam(model, 'ParamEyeROpen', 0);
              } else if (blinkPhase === 2 && elapsed > 50) {
                blinkPhase = 3;
                blinkTimer = t;
              } else if (blinkPhase === 3 && elapsed < 120) {
                const p = elapsed / 120;
                setParam(model, 'ParamEyeLOpen', p);
                setParam(model, 'ParamEyeROpen', p);
              } else if (blinkPhase === 3) {
                setParam(model, 'ParamEyeLOpen', 1);
                setParam(model, 'ParamEyeROpen', 1);
                blinkPhase = 0;
                nextBlink = t + 2000 + Math.random() * 4000;
              }
            }
          }

          // ═══ Re-apply expression overrides AFTER idle updates ═══
          // This ensures expression params win over idle animation every frame
          if (hasOverrides) {
            for (const [paramId, value] of Object.entries(overrides)) {
              setParam(model, paramId, value);
            }
          }
        } catch { }
        frame = requestAnimationFrame(animate);
      }
      animate();
      return () => cancelAnimationFrame(frame);
    }

    // Set expression + motion based on emotion
    function applyEmotion(model, emotion) {
      const expressionMap = {
        happy: ["happy", "smile", "f01"],
        sad: ["sad", "cry", "f04"],
        angry: ["angry", "f03"],
        surprised: ["surprised", "shock", "f02"],
        thinking: ["thinking", "doubt"],
        neutral: ["neutral", "idle", "f00"],
      };
      const motionMap = {
        happy: ["tap_body", "flick_head", "shake"],
        sad: ["idle"],
        angry: ["shake", "tap_body"],
        surprised: ["flick_head", "pinch_in", "tap_body"],
        thinking: ["idle"],
        neutral: ["idle"],
      };

      const expressions = expressionMap[emotion] || ["neutral"];
      for (const expr of expressions) {
        try { model.expression(expr); break; } catch { }
      }
      const motions = motionMap[emotion] || ["idle"];
      for (const m of motions) {
        try { model.motion(m, undefined, 3); break; } catch { }
      }
    }

    // Set a single Live2D model parameter by ID (used by marketplace expressions)
    function setParam(model, paramId, value) {
      if (!model || !model.internalModel) return;
      const coreModel = model.internalModel.coreModel;
      if (!coreModel) return;
      // Try direct parameter setting
      try {
        const paramIndex = coreModel._model?.parameters?.ids?.indexOf(paramId);
        if (paramIndex !== undefined && paramIndex >= 0) {
          coreModel.setParameterValueById(paramId, value);
        } else {
          // Fallback: try all known parameter access methods
          if (typeof coreModel.setParameterValueById === 'function') {
            coreModel.setParameterValueById(paramId, value);
          } else if (typeof coreModel.setParamFloat === 'function') {
            coreModel.setParamFloat(paramId, value);
          }
        }
      } catch (e) {
        console.warn("[Avatar] setParam failed for", paramId, e);
      }
    }

    // Debug: list all model parameters (called once on first expression apply)
    function logModelParams(model) {
      if (window._paramsLogged) return;
      window._paramsLogged = true;
      try {
        const coreModel = model.internalModel.coreModel;
        const ids = coreModel._model?.parameters?.ids;
        if (ids) {
          console.log("[Avatar] 📋 Model parameters (" + ids.length + "):", ids.join(', '));
        }
      } catch (e) {
        console.warn("[Avatar] Could not list model parameters:", e);
      }
    }

    // Voice selection for browser TTS fallback
    function getBestVoice(text) {
      const voices = speechSynthesis.getVoices();
      const hasChinese = /[\u4e00-\u9fff]/.test(text);
      const hasJapanese = /[\u3040-\u309f\u30a0-\u30ff]/.test(text);
      if (hasChinese) return voices.find(v => v.lang.startsWith("zh")) || null;
      if (hasJapanese) return voices.find(v => v.lang.startsWith("ja")) || null;
      return voices.find(v => v.name.includes("Samantha"))
        || voices.find(v => v.lang.startsWith("en")) || null;
    }

    // ═══ AUTO-DETECT accessory position from model's own drawable data ═══
    // Works for ALL skeletons — no hardcoded coordinates needed.
    // Uses HitArea/drawable name → vertex center → model-local coords via PPU.
    //
    // Cubism vertex space: center=(0,0), Y-up, units = 1/PPU
    // PIXI local with anchor(0.5,0.5): center=(0,0), Y-down
    // Conversion: pixi_x = vertex_x * PPU, pixi_y = -vertex_y * PPU

    const SLOT_META = {
      face_deco: { region: 'head', verticalBias: 0.10, sizeRatio: 0.50, followHead: true },
      headwear: { region: 'head', verticalBias: -0.20, sizeRatio: 0.60, followHead: true },
      hair: { region: 'head', verticalBias: -0.10, sizeRatio: 0.60, followHead: true },
      wings: { region: 'body', verticalBias: 0, sizeRatio: 0.80, followHead: false },
      outfit: { region: 'body', verticalBias: 0, sizeRatio: 0.60, followHead: false },
      held_item: { region: 'body', verticalBias: 0.3, sizeRatio: 0.25, followHead: false },
    };

    function autoDetectSlotPosition(model, slotType) {
      const meta = SLOT_META[slotType] || SLOT_META.face_deco;
      const coreModel = model.internalModel.coreModel;
      const ow = model.internalModel.originalWidth || 2400;
      const oh = model.internalModel.originalHeight || 4500;

      // Get PPU for coordinate conversion
      let ppu = 2400;
      try {
        const ci = coreModel._model?.canvasinfo;
        if (ci && ci.PixelsPerUnit > 0) ppu = ci.PixelsPerUnit;
      } catch (e) { }

      // Find drawable for this region (head or body)
      let drawableIdx = -1;
      const targetRegion = meta.region;

      // Layer 1: HitArea lookup
      try {
        const hitAreas = model.internalModel.settings.hitAreas;
        if (hitAreas) {
          for (const area of hitAreas) {
            if ((area.Name || '').toLowerCase().includes(targetRegion)) {
              const idx = coreModel.getDrawableIndex(area.Id);
              if (idx >= 0) { drawableIdx = idx; break; }
            }
          }
        }
      } catch (e) { }

      // Layer 2: Drawable name matching
      if (drawableIdx < 0) {
        try {
          const count = coreModel.getDrawableCount();
          const keywords = targetRegion === 'head' ? ['head', 'face', 'hair'] : ['body', 'torso', 'bust'];
          for (const kw of keywords) {
            for (let i = 0; i < count; i++) {
              const id = coreModel.getDrawableId(i);
              if (id && id.toLowerCase().includes(kw)) { drawableIdx = i; break; }
            }
            if (drawableIdx >= 0) break;
          }
        } catch (e) { }
      }

      // Get vertex center of the drawable
      let cx = 0, cy = 0;
      if (drawableIdx >= 0) {
        try {
          const verts = coreModel.getDrawableVertices(drawableIdx);
          if (verts && verts.length >= 4) {
            const n = verts.length / 2;
            let sx = 0, sy = 0, minY = Infinity, maxY = -Infinity;
            for (let i = 0; i < verts.length; i += 2) {
              sx += verts[i]; sy += verts[i + 1];
              minY = Math.min(minY, verts[i + 1]);
              maxY = Math.max(maxY, verts[i + 1]);
            }
            cx = sx / n;
            cy = sy / n;
            // verticalBias: shift within the drawable's range
            // -1 = top of drawable, 0 = center, +1 = bottom
            const range = maxY - minY;
            cy += meta.verticalBias * range;
          }
        } catch (e) { }
      }

      // Convert Cubism vertex → PIXI local coords
      const pixiX = cx * ppu;
      const pixiY = -cy * ppu; // flip Y

      console.log('[S108] Auto-detected position:', {
        slot: slotType, region: targetRegion, drawableIdx,
        vertex: { cx: cx.toFixed(3), cy: cy.toFixed(3) },
        pixi: { x: pixiX.toFixed(0), y: pixiY.toFixed(0) },
        ppu, modelCanvas: ow + '×' + oh
      });

      return {
        x: 0,  // Force center — HitArea offset is unreliable
        y: pixiY,
        size: ow * meta.sizeRatio,
        followHead: meta.followHead,
      };
    }

    // Helper: read a model parameter value
    function getParamValue(coreModel, paramId) {
      try {
        if (typeof coreModel.getParameterValueById === 'function') {
          return coreModel.getParameterValueById(paramId);
        }
        if (typeof coreModel.getParamFloat === 'function') {
          return coreModel.getParamFloat(paramId);
        }
      } catch (e) { }
      return 0;
    }

    async function loadModel() {
      try {
        const model = await PIXI.live2d.Live2DModel.from(modelUrl, { autoInteract: true });
        window._live2dModel = model;
        window._muteModelSounds = false; // Only mute during our TTS playback

        // Intercept model sounds — only block when our TTS is playing
        try {
          if (model.internalModel?.motionManager) {
            const origStartMotion = model.internalModel.motionManager.startMotion;
            model.internalModel.motionManager.startMotion = function (group, index, priority) {
              if (window._muteModelSounds) {
                // Our TTS is playing — skip model's built-in sounds to avoid overlap
                const settings = this.settings;
                const origGetSoundFile = settings.getMotionSoundFile;
                settings.getMotionSoundFile = () => undefined;
                const result = origStartMotion.call(this, group, index, priority);
                settings.getMotionSoundFile = origGetSoundFile;
                return result;
              }
              // Normal — let model sounds play (Shizuku's voice, etc.)
              return origStartMotion.call(this, group, index, priority);
            };
          }
        } catch (e) { console.warn("Could not setup sound control:", e); }

        const scale = Math.min(window.innerWidth / model.width, window.innerHeight / model.height) * 0.8;
        model.scale.set(scale);
        model.anchor.set(0.5, 0.5);
        model.x = window.innerWidth / 2;
        model.y = window.innerHeight / 2;
        app.stage.addChild(model);

        // Start idle animation
        startIdleAnimation(model);

        // Mouse tracking — eyes follow cursor
        document.addEventListener("pointermove", (e) => {
          model.focus(e.clientX, e.clientY);
        });

        // Preload voices for fallback
        speechSynthesis.getVoices();

        window.parent.postMessage({ type: "live2d-ready" }, "*");

        // Track audio sources to avoid re-creating MediaElementSource
        const audioSourceMap = new WeakMap();

        window.addEventListener("message", async (e) => {
          if (e.data.type === "speak") {
            const { text, emotion, audioUrl, useBrowserTTS } = e.data;

            applyEmotion(model, emotion || "neutral");
            window._muteModelSounds = true; // Mute model sounds while our TTS plays

            if (audioUrl && !useBrowserTTS) {
              // Server TTS audio — real lip sync
              const audio = new Audio(audioUrl);
              audio.crossOrigin = "anonymous";
              window._currentAudio = audio; // Track for interrupt
              let stopLipSync;

              audio.onplay = () => {
                try {
                  stopLipSync = startAudioLipSync(model, audio);
                  window._stopLipSync = stopLipSync; // Track for interrupt
                } catch (err) {
                  // If MediaElementSource fails, use simulated
                  console.warn("Audio lip sync failed, using simulated:", err);
                  stopLipSync = animateMouthSimulated(model, text.length * 80);
                  window._stopLipSync = stopLipSync;
                }
              };

              audio.onended = () => {
                if (stopLipSync) stopLipSync();
                window._currentAudio = null;
                window._stopLipSync = null;
                window._muteModelSounds = false;
                setMouth(model, 0);
                window.parent.postMessage({ type: "speak-done" }, "*");
                setTimeout(() => applyEmotion(model, "neutral"), 2000);
              };

              audio.onerror = () => {
                if (stopLipSync) stopLipSync();
                window._currentAudio = null;
                window._stopLipSync = null;
                window._muteModelSounds = false;
                window.parent.postMessage({ type: "speak-done" }, "*");
              };

              try { await audio.play(); } catch (err) {
                console.warn("Audio play failed:", err);
                window._currentAudio = null;
                window._muteModelSounds = false;
                window.parent.postMessage({ type: "speak-done" }, "*");
              }

            } else {
              // Browser TTS fallback
              if (speechSynthesis && speechSynthesis.getVoices().length > 0) {
                const utterance = new SpeechSynthesisUtterance(text);
                const voice = getBestVoice(text);
                if (voice) utterance.voice = voice;

                let stopMouth;
                utterance.onstart = () => {
                  stopMouth = animateMouthSimulated(model, Math.max(text.length * 80, 1500));
                };
                utterance.onend = () => {
                  if (stopMouth) stopMouth();
                  setMouth(model, 0);
                  window._muteModelSounds = false;
                  window.parent.postMessage({ type: "speak-done" }, "*");
                  setTimeout(() => applyEmotion(model, "neutral"), 2000);
                };
                utterance.onerror = () => {
                  if (stopMouth) stopMouth();
                  window._muteModelSounds = false;
                  window.parent.postMessage({ type: "speak-done" }, "*");
                };
                speechSynthesis.speak(utterance);
              } else {
                // No TTS available at all — still animate mouth so avatar looks alive
                console.warn("[Avatar] No TTS available, using silent mouth animation");
                const stopMouth = animateMouthSimulated(model, Math.max(text.length * 80, 1500));
                setTimeout(() => {
                  if (stopMouth) stopMouth();
                  setMouth(model, 0);
                  window.parent.postMessage({ type: "speak-done" }, "*");
                  setTimeout(() => applyEmotion(model, "neutral"), 2000);
                }, Math.max(text.length * 80, 1500));
              }
            }
          }

          if (e.data.type === "stop-speaking") {
            speechSynthesis.cancel();
            if (window._currentAudio) {
              window._currentAudio.pause();
              window._currentAudio.currentTime = 0;
              window._currentAudio.src = "";
              window._currentAudio = null;
            }
            if (window._stopLipSync) {
              window._stopLipSync();
              window._stopLipSync = null;
            }
            setMouth(model, 0);
            window._muteModelSounds = false;
            window.parent.postMessage({ type: "speak-done" }, "*");
          }

          // ═══ Marketplace Asset Handlers ═══

          // Motion: play a motion3.json animation on the model
          if (e.data.type === "load-motion") {
            try {
              const url = e.data.url;
              console.log("[Avatar] Loading motion:", url);

              // Fetch the motion data
              const res = await fetch(url);
              const motionData = await res.json();

              // Case 1: motion config JSON with { group, index } — plays built-in motion
              if (motionData.group) {
                try { model.motion(motionData.group, motionData.index || 0, 3); } catch { }
                window.parent.postMessage({ type: "motion-loaded", url }, "*");
                return;
              }

              // Case 2: motion3.json with Curves — animate parameters directly
              if (motionData.Curves && Array.isArray(motionData.Curves)) {
                const duration = motionData.Meta?.Duration || 3;
                const startTime = performance.now();

                function animateMotion() {
                  const elapsed = (performance.now() - startTime) / 1000;
                  if (elapsed > duration) {
                    window.parent.postMessage({ type: "motion-loaded", url }, "*");
                    return;
                  }

                  for (const curve of motionData.Curves) {
                    if (curve.Target === "Parameter" && curve.Segments) {
                      // Linear interpolation through segments
                      const segments = curve.Segments;
                      const t = elapsed / duration;
                      const idx = Math.min(Math.floor(t * (segments.length / 2)), segments.length / 2 - 1) * 2;
                      const value = segments[idx + 1] !== undefined ? segments[idx + 1] : 0;
                      setParam(model, curve.Id, value);
                    }
                  }
                  requestAnimationFrame(animateMotion);
                }
                requestAnimationFrame(animateMotion);
                return;
              }

              // Case 3: try as built-in motion group name
              if (typeof motionData === 'string' || motionData.name) {
                const name = motionData.name || motionData;
                try { model.motion(name, 0, 3); } catch { }
              }

              window.parent.postMessage({ type: "motion-loaded", url }, "*");
            } catch (err) {
              console.warn("[Avatar] Motion load failed:", err);
              window.parent.postMessage({ type: "motion-error", error: err.message }, "*");
            }
          }

          // Expression: load and apply an expression preset
          // Uses persistent override system — expression params stored in window._expressionOverrides
          // and re-applied every frame by startIdleAnimation, preventing idle from overwriting them.
          if (e.data.type === "load-expression") {
            try {
              const url = e.data.url;
              console.log("[Avatar] Loading expression:", url);

              // Log all model parameters on first expression apply (debug)
              logModelParams(model);

              // Try loading as JSON expression data
              const res = await fetch(url);
              const expData = await res.json();

              // Track which expression index we're on (for expression packs with multiple)
              window._expressionPackIndex = (window._expressionPackIndex || 0);

              let applied = false;
              const collectedParams = {}; // Collect all params before applying

              // Case 1: exp3 format — { Parameters: [{ Id, Value }] }
              if (expData.Parameters && Array.isArray(expData.Parameters)) {
                for (const param of expData.Parameters) {
                  collectedParams[param.Id] = param.Value;
                }
                applied = true;
                console.log("[Avatar] ✅ Expression applied (exp3 format,", expData.Parameters.length, "params)");
              }
              // Case 2: Expression pack format from generate-expression API
              // { expressions: [{ id, label, params: { ParamX: value } }] }
              else if (expData.expressions && Array.isArray(expData.expressions) && expData.expressions.length > 0) {
                const idx = window._expressionPackIndex % expData.expressions.length;
                const expr = expData.expressions[idx];
                if (expr?.params && typeof expr.params === 'object') {
                  for (const [paramId, value] of Object.entries(expr.params)) {
                    if (typeof value === 'number') {
                      collectedParams[paramId] = value;
                    }
                  }
                  applied = true;
                  console.log("[Avatar] ✅ Expression applied (pack format, expr:", expr.label || expr.id, ",", Object.keys(collectedParams).length, "params)");
                }
                window._expressionPackIndex = idx + 1;
              }
              // Case 3: expression_config wrapper from API response
              else if (expData.expression_config) {
                const config = expData.expression_config;
                if (config.expressions && Array.isArray(config.expressions)) {
                  const expr = config.expressions[0];
                  if (expr?.params) {
                    for (const [paramId, value] of Object.entries(expr.params)) {
                      if (typeof value === 'number') collectedParams[paramId] = value;
                    }
                    applied = true;
                    console.log("[Avatar] ✅ Expression applied (config wrapper format)");
                  }
                }
              }
              // Case 4: Simple key-value object — { ParamEyeLSmile: 0.8, ParamMouthForm: 1.0 }
              if (!applied && typeof expData === 'object') {
                for (const [paramId, value] of Object.entries(expData)) {
                  if (typeof value === 'number' && paramId.startsWith('Param')) {
                    collectedParams[paramId] = value;
                  }
                }
                if (Object.keys(collectedParams).length > 0) {
                  applied = true;
                  console.log("[Avatar] ✅ Expression applied (key-value format,", Object.keys(collectedParams).length, "params)");
                }
              }

              if (applied) {
                // Store as persistent overrides — idle animation will re-apply these each frame
                window._expressionOverrides = collectedParams;
                window._expressionActive = true;
                // Apply immediately
                for (const [paramId, value] of Object.entries(collectedParams)) {
                  setParam(model, paramId, value);
                }
                console.log("[Avatar] 🔒 Expression overrides set:", JSON.stringify(collectedParams));
              } else {
                console.warn("[Avatar] ⚠️ Expression format not recognized:", Object.keys(expData));
              }

              window.parent.postMessage({ type: "expression-loaded", url }, "*");
            } catch (err) {
              console.warn("[Avatar] Expression load failed:", err);
              window.parent.postMessage({ type: "expression-error", error: err.message }, "*");
            }
          }

          // Clear expression overrides (when unequipping expression)
          if (e.data.type === "clear-expression") {
            window._expressionOverrides = {};
            window._expressionActive = false;
            window._expressionPackIndex = 0;
            console.log("[Avatar] 🔓 Expression overrides cleared");
            window.parent.postMessage({ type: "expression-cleared" }, "*");
          }

          // VTuber mode: camera head tracking → set head angles
          if (e.data.type === "set-head-angles") {
            try {
              const { x, y, z } = e.data;
              setParam(model, 'ParamAngleX', x || 0);
              setParam(model, 'ParamAngleY', y || 0);
              setParam(model, 'ParamAngleZ', z || 0);
              // Also slightly move body for naturalness
              setParam(model, 'ParamBodyAngleX', (x || 0) * 0.3);
              setParam(model, 'ParamBodyAngleY', (y || 0) * 0.2);
            } catch (err) {
              // Silently ignore — not all models have these params
            }
          }

          // ═══ S106 FIX: Accessory as PIXI.Sprite with worldTransform tracking ═══
          // Strategy diagnosis (4/4 23:00): BUILD's original approach used an independent
          // Canvas 2D overlay + manual vertexToScreen() — this is architecturally wrong.
          // Correct approach: PIXI.Sprite on app.stage + model.worldTransform.apply()
          if (e.data.type === "add-accessory") {
            try {
              const url = e.data.url;
              const slotType = e.data.slotType || 'headwear';
              console.log("[Avatar] 🎯 S108 Adding accessory:", url, "slot:", slotType);

              // Clean up existing accessories (both old and new style)
              if (window._accessorySprites) {
                for (const s of window._accessorySprites) {
                  try { s.parent?.removeChild(s); s.destroy(); } catch { }
                }
              }
              window._accessorySprites = [];
              if (window._accessoryTickerFn) {
                app.ticker.remove(window._accessoryTickerFn);
                window._accessoryTickerFn = null;
              }
              if (window._accessoryCanvases) {
                for (const c of window._accessoryCanvases) { try { c.remove(); } catch { } }
                window._accessoryCanvases = [];
              }
              if (window._accessoryFrameId) {
                cancelAnimationFrame(window._accessoryFrameId);
                window._accessoryFrameId = null;
              }

              // Auto-detect slot position from model's own drawable data
              const slot = autoDetectSlotPosition(model, slotType);

              const isLive2DModel = url.includes("model3.json") || url.includes("model.json");

              if (!isLive2DModel) {
                // ═══ S108 FIX v2: app.stage + model.toGlobal() ═══
                // model.addChild() renders BEHIND the Live2D mesh (z-order bug).
                // Fix: add sprite to app.stage (guaranteed on top), then use
                // model.toGlobal() to convert model-local coords → screen coords
                // every frame via ticker. Auto-detected position stays correct
                // for all models/skeletons.

                const texture = PIXI.Texture.from(url);
                const sprite = new PIXI.Sprite(texture);
                sprite.anchor.set(0.5, 0.5);

                // Add to app.stage (renders ON TOP of model)
                app.stage.addChild(sprite);
                window._accessorySprites.push(sprite);

                // Size sprite relative to model's screen size
                const applySizing = () => {
                  const screenScale = model.scale.x || 0.15;
                  const screenSize = slot.size * screenScale;
                  const texW = sprite.texture.width || 100;
                  const texH = sprite.texture.height || 100;
                  const ratio = texW / texH;
                  if (ratio >= 1) {
                    sprite.width = screenSize;
                    sprite.height = screenSize / ratio;
                  } else {
                    sprite.width = screenSize * ratio;
                    sprite.height = screenSize;
                  }
                };

                if (texture.baseTexture.valid) {
                  applySizing();
                } else {
                  texture.baseTexture.once('loaded', applySizing);
                }

                // ═══ POSITION STRATEGY ═══
                // toGlobal(0,0) = near head top in screen coords (verified: 319,21)
                // Use proportional offset from model.position based on model screen height
                // Slot offsets: fraction of model's screen height from model center
                const SLOT_SCREEN_OFFSETS = {
                  face_deco: { yRatio: -0.30, sizeRatio: 0.12 },  // face/eyes
                  headwear: { yRatio: -0.38, sizeRatio: 0.15 },  // top of head
                  hair: { yRatio: -0.35, sizeRatio: 0.18 },  // hair area
                  wings: { yRatio: 0.05, sizeRatio: 0.30 },   // back/torso
                  outfit: { yRatio: 0.05, sizeRatio: 0.25 },   // body
                  held_item: { yRatio: 0.15, sizeRatio: 0.08 },   // hand
                };
                const screenOffset = SLOT_SCREEN_OFFSETS[slotType] || SLOT_SCREEN_OFFSETS.face_deco;

                const tickerFn = () => {
                  if (!model) return;
                  const screenScale = model.scale.x || 0.15;
                  const oh = model.internalModel?.originalHeight || 4500;
                  const modelScreenH = oh * screenScale;

                  // Position relative to model's screen position
                  let sx = model.x;
                  let sy = model.y + screenOffset.yRatio * modelScreenH;

                  // Head-following: subtle ParamAngle sway
                  if (slot.followHead && model?.internalModel?.coreModel) {
                    const cm = model.internalModel.coreModel;
                    const ax = getParamValue(cm, 'ParamAngleX');
                    const ay = getParamValue(cm, 'ParamAngleY');
                    const az = getParamValue(cm, 'ParamAngleZ');
                    sx += ax * (modelScreenH * 0.003);
                    sy += ay * (modelScreenH * 0.002);
                    sprite.rotation = az * 0.008;
                  }

                  sprite.position.set(sx, sy);
                };
                window._accessoryTickerFn = tickerFn;
                app.ticker.add(tickerFn);
                tickerFn(); // run once immediately

                console.log('[S108] ✅ Accessory on stage.', {
                  slot: slotType, yRatio: screenOffset.yRatio,
                  modelPos: { x: model.x, y: model.y },
                  modelScale: model.scale.x,
                  method: 'model.position + proportional offset'
                });

                window.parent.postMessage({
                  type: "accessory-added", url, slotType,
                  method: 'stage.addChild + toGlobal'
                }, "*");

              } else {
                // Live2D model as accessory — parameter sync approach
                try {
                  const accessory = await PIXI.live2d.Live2DModel.from(url);
                  const accScale = slot.size / Math.max(accessory.width, accessory.height);
                  accessory.scale.set(accScale);
                  accessory.anchor.set(0.5, 0.5);
                  accessory.position.set(slot.x, slot.y);
                  model.addChild(accessory);
                  window._accessorySprites.push(accessory);
                } catch (err) {
                  console.warn("[Avatar] Live2D accessory load failed:", err);
                }
                window.parent.postMessage({ type: "accessory-added", url }, "*");
              }
            } catch (err) {
              console.warn("[Avatar] Accessory load failed:", err);
              window.parent.postMessage({ type: "accessory-error", error: err.message }, "*");
            }
          }

          // ═══ S107a FIX: Skin Texture Hot-Swap with fallback chain ═══
          if (e.data.type === "swap-skin-texture") {
            try {
              const textureUrl = e.data.textureUrl;
              const textureIndex = e.data.textureIndex || 0;
              console.log("[Avatar] 🎨 Hot-swapping skin:", textureUrl, "idx:", textureIndex);

              // Load new texture via Image for cross-origin support
              const img = new Image();
              img.crossOrigin = "anonymous";
              img.src = textureUrl;

              img.onload = () => {
                try {
                  const renderer = app.renderer;

                  // Method 1: pixi-live2d-display bindTexture API
                  if (typeof model.internalModel.bindTexture === 'function') {
                    const newTexture = PIXI.Texture.from(img);
                    renderer.texture.bind(newTexture.baseTexture);
                    const glTex = newTexture.baseTexture._glTextures[renderer.CONTEXT_UID];
                    if (glTex) {
                      model.internalModel.bindTexture(textureIndex, glTex.texture);
                      console.log("[Avatar] ✅ Skin swapped via bindTexture!");
                      window.parent.postMessage({ type: "skin-swapped", textureUrl }, "*");
                      return;
                    }
                  }

                  // Method 2: Direct texture array replacement
                  const textures = model.internalModel.textureManager?.textures
                    || model.internalModel.textures;
                  if (textures && textures[textureIndex]) {
                    const oldBaseTex = textures[textureIndex];
                    const newTexture = PIXI.Texture.from(img);
                    if (oldBaseTex.baseTexture) {
                      oldBaseTex.baseTexture.resource = newTexture.baseTexture.resource;
                      oldBaseTex.baseTexture.update();
                      console.log("[Avatar] ✅ Skin swapped via texture replacement!");
                      window.parent.postMessage({ type: "skin-swapped", textureUrl }, "*");
                      return;
                    }
                  }

                  // Method 3: Signal parent to reload model
                  console.warn("[Avatar] bindTexture unavailable, requesting model reload...");
                  window.parent.postMessage({ type: "skin-swap-reload", textureUrl }, "*");
                } catch (err) {
                  console.warn("[Avatar] ❌ Skin swap failed:", err);
                  window.parent.postMessage({ type: "skin-swap-error", error: err.message }, "*");
                }
              };
              img.onerror = () => {
                console.warn("[Avatar] ❌ Texture load failed:", textureUrl);
                window.parent.postMessage({ type: "skin-swap-error", error: "Image load failed" }, "*");
              };
            } catch (err) {
              console.warn("[Avatar] Skin swap error:", err);
              window.parent.postMessage({ type: "skin-swap-error", error: err.message }, "*");
            }
          }
        });

      } catch (err) {
        console.error("Failed to load Live2D model:", err);
        window.parent.postMessage({ type: "live2d-error", error: err.message }, "*");
      }
    }

    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

    // ═══ WebGL availability check ═══
    function isWebGLAvailable() {
      try {
        const canvas = document.createElement('canvas');
        return !!(canvas.getContext('webgl') || canvas.getContext('webgl2') || canvas.getContext('experimental-webgl'));
      } catch { return false; }
    }

    if (_scriptsFailed) {
      // Scripts already failed — error was sent in _onScriptError
      console.error("[Avatar] CDN scripts failed, skipping loadModel");
    } else if (!isWebGLAvailable()) {
      console.error("[Avatar] WebGL not available in this environment");
      window.parent.postMessage({ type: "live2d-error", error: "WebGL not supported in this browser" }, "*");
    } else if (typeof PIXI === 'undefined' || !PIXI.live2d) {
      console.error("[Avatar] PIXI or live2d-display not loaded");
      window.parent.postMessage({ type: "live2d-error", error: "Live2D libraries not loaded" }, "*");
    } else {
      loadModel();
    }

    window.addEventListener("resize", () => {
      const model = window._live2dModel;
      if (model) {
        const scale = Math.min(window.innerWidth / model.width, window.innerHeight / model.height) * 0.8;
        model.scale.set(scale);
        model.anchor.set(0.5, 0.5);
        model.x = window.innerWidth / 2;
        model.y = window.innerHeight / 2;
      }
    });
  </script>
</body>
